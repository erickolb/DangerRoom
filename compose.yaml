services:
  dangerroom:
    build: .
    image: dangerroom:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4340"
      DATA_DIR: /data
      REQUIRE_AUTH: "true"
      DANGERROOM_ADMIN_TOKEN: ${DANGERROOM_ADMIN_TOKEN:?Set a random browser access key of at least 32 characters in .env}
    ports:
      - "127.0.0.1:${DANGERROOM_PORT:-4340}:4340"
    volumes:
      - dangerroom-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 70s
volumes:
  dangerroom-data:
