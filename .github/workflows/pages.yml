name: Publish website
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/*sidestore_source.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish iOS release']
    types: [completed]
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SideStore source from published iOS IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s scripts -p test_sidestore_source.py
          python scripts/sidestore_source.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
