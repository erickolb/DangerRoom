name: Publish website
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/*sidestore_source.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish iOS release']
    types: [completed]
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release-dispatch:
    # Release runs use a tag ref, which the Pages environment correctly rejects.
    # Start a separate run on main rather than weakening environment protection.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy the website from main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            });
  deploy:
    if: github.event_name != 'release' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SideStore source from published iOS IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s scripts -p test_sidestore_source.py
          python scripts/sidestore_source.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
